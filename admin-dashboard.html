<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./assets/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Dashboard — Stackly</title>
    <meta name="description" content="Stackly Admin Dashboard" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link href="./css/style.css" rel="stylesheet" />
  </head>
  <body class="dashboard-body">
    <div id="loader" class="loader"><div class="loader__logo"><span class="loader__ring"></span><span class="loader__text">Stackly</span></div></div>

    <div class="dashboard-layout">
      <!-- Sidebar -->
      <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">
          <a href="javascript:void(0);" onclick="window.navigateTo('dashboard');" class="sidebar-brand" id="dashboardBrandLogo">
            <img src="assets/images/logo-stackly.png" alt="Stackly" class="project-logo">
          </a>
        </div>
        <nav class="sidebar-nav">
          <div class="sidebar-section-label">Main</div>
          <a class="sidebar-link active" data-page="dashboard"><i class="bi bi-grid-1x2"></i><span class="nav-item-label">Dashboard</span></a>
          <a class="sidebar-link" data-page="customers"><i class="bi bi-people"></i><span class="nav-item-label">Customers</span></a>
          <a class="sidebar-link" data-page="accounts"><i class="bi bi-wallet2"></i><span class="nav-item-label">Accounts</span></a>
          <a class="sidebar-link" data-page="transactions"><i class="bi bi-arrow-left-right"></i><span class="nav-item-label">Transactions</span></a>

          <div class="sidebar-section-label">Operations</div>
          <a class="sidebar-link" data-page="loans"><i class="bi bi-bank"></i><span class="nav-item-label">Loans</span></a>
          <a class="sidebar-link" data-page="cards"><i class="bi bi-credit-card-2-front"></i><span class="nav-item-label">Cards</span></a>

          <div class="sidebar-section-label">System</div>
          <a class="sidebar-link" data-page="reports"><i class="bi bi-file-earmark-bar-graph"></i><span class="nav-item-label">Reports</span></a>
          <a class="sidebar-link" data-page="settings"><i class="bi bi-gear"></i><span class="nav-item-label">Settings</span></a>
        </nav>
        <div class="sidebar-footer">
          <div class="sidebar-user">
            <div class="sidebar-user__avatar">AD</div>
            <div class="sidebar-user__info"><strong>Admin User</strong><small>Administrator</small></div>
          </div>
          <button class="btn btn-outline-glow w-100 mt-3 d-flex justify-content-center align-items-center gap-2" style="border-color: #ef4444; color: #ef4444;" onclick="logout()">
            <i class="bi bi-box-arrow-right"></i> <span>Logout</span>
          </button>
        </div>
      </aside>
      <div class="sidebar-backdrop" id="sidebarBackdrop"></div>

      <!-- Main content -->
      <div class="dashboard-main" id="dashboardMain">
        <!-- Topbar -->
        <div class="dashboard-topbar">
          <a href="index.html" class="d-lg-none">
            <img src="./assets/images/logo-stackly.png" alt="Stackly" height="24" class="project-logo">
          </a>
          <div class="topbar-search">
            <i class="bi bi-search"></i>
            <input type="text" placeholder="Search customers, transactions, loans..." />
          </div>
          <button class="topbar-mobile-toggle ms-auto" id="mobileToggle"><i class="bi bi-list"></i></button>
        </div>

        <!-- Dashboard content -->
        <div class="dashboard-content" id="dashboardContent">
          <!-- Pages injected by admin.js -->
        </div>
      </div>
    </div>

    <!-- Modal container -->
    <div class="modal fade" id="actionModal" tabindex="-1">
      <div class="modal-dialog modal-lg modal-dialog-centered">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title" id="actionModalTitle">Action</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
          </div>
          <div class="modal-body" id="actionModalBody"></div>
          <div class="modal-footer" id="actionModalFooter"></div>
        </div>
      </div>
    </div>

    <div class="toast-container" id="toastContainer"></div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
    <script src="./js/data.js"></script>
    <script src="./js/main.js"></script>
    <script src="./js/admin.js"></script>
  </body>
</html>
