<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./assets/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Page Not Found — Stackly</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link href="./css/style.css" rel="stylesheet" />
    <style>
      .error-page {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 2rem;
      }
      .error-code {
        font-size: 8rem;
        font-weight: 800;
        background: var(--nb-grad-primary);
        -webkit-background-clip: text;
        background-clip: text;
        -webkit-text-fill-color: transparent;
        line-height: 1;
        margin-bottom: 1rem;
      }
      .error-msg {
        font-size: 1.5rem;
        font-weight: 600;
        margin-bottom: 2rem;
        color: var(--text-primary);
      }
    </style>
  </head>
  <body>
    <main class="error-page">
      <div class="glass-card" style="max-width: 600px; width: 100%;">
        <div class="error-code">404</div>
        <div class="error-msg">Oops! We couldn't find that page.</div>
        <p class="text-muted-2 mb-4">The page you are looking for might have been removed, had its name changed, or is temporarily unavailable.</p>
        
        <div class="d-flex flex-column flex-sm-row justify-content-center gap-3">
          <a href="index.html" class="btn btn-outline-glow"><i class="bi bi-house me-2"></i> Return to Home</a>
          <button id="btnReturnDashboard" onclick="returnToDashboard()" class="btn btn-glow" style="display: none;"><i class="bi bi-grid-1x2 me-2"></i> Return to Dashboard</button>
        </div>
      </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="./js/data.js"></script>
    <script src="./js/main.js"></script>
    <script>
      const session = typeof store !== 'undefined' ? store.getSession() : null;
      
      if (session && session.role) {
        document.getElementById('btnReturnDashboard').style.display = 'inline-block';
      }

      function returnToDashboard() {
        if (session && session.role) {
          window.location.href = session.role === 'admin' ? 'admin-dashboard.html' : 'customer-dashboard.html';
        } else {
          window.location.href = 'login.html';
        }
      }
    </script>
  </body>
</html>
